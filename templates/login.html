{% extends 'base.html' %}
  {% block title %}Sign In — CodeForge{% endblock %}
  {% block body %}
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-card__top">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="var(--accent)"/></svg>
        <h1>Welcome back</h1>
        <p>Sign in to your CodeForge account</p>
      </div>
      <button id="btn-google" class="btn-social">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
      <div class="auth-divider"><span>or</span></div>
      <div class="field"><label>Email</label><input type="email" id="email" placeholder="you@example.com"></div>
      <div class="field"><label>Password <a href="#" id="forgot" class="field__link">Forgot?</a></label><input type="password" id="password" placeholder="Your password"></div>
      <div id="err" class="auth-err"></div>
      <button id="btn-login" class="btn btn--primary btn--full">Sign in</button>
      <p class="auth-switch">No account? <a href="{{ url_for('register') }}">Create one</a></p>
    </div>
  </div>
  {% endblock %}
  {% block scripts %}
  <script>
  firebase.initializeApp(FB);
  const auth = firebase.auth();
  async function doSession(user) {
    const token = await user.getIdToken();
    const r = await fetch('/auth/session', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken:token})});
    const d = await r.json();
    window.location = d.is_admin ? '/admin' : '/dashboard';
  }
  document.getElementById('btn-google').onclick = () => auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).then(r=>doSession(r.user)).catch(e=>err(e.message));
  document.getElementById('btn-login').onclick = async () => {
    try { const r = await auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value); doSession(r.user); }
    catch(e) { err(e.message); }
  };
  document.getElementById('forgot').onclick = async ev => {
    ev.preventDefault();
    const em = document.getElementById('email').value;
    if(!em){err('Enter your email above first.');return;}
    await auth.sendPasswordResetEmail(em);
    err('Reset email sent! Check your inbox.');
  };
  function err(m){const el=document.getElementById('err');el.textContent=m;el.style.display='block';}
  </script>
  {% endblock %}
