{% extends 'base.html' %}
  {% block title %}Profile — CodeForge{% endblock %}
  {% block body %}
  <div class="account-layout">
    {% include 'partials/sidebar.html' %}
    <div class="account-main">
      <div class="page-header"><h1>Profile Settings</h1></div>
      <div class="card-box" style="max-width:560px">
        <form method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="field"><label>Full Name</label><input type="text" name="name" value="{{ current_user.get('name','') if current_user else '' }}"></div>
          <div class="field"><label>Email <span class="text-muted text-sm">(cannot be changed)</span></label><input type="email" value="{{ current_user.get('email','') if current_user else '' }}" disabled></div>
          <div class="field"><label>Bio</label><textarea name="bio" rows="3">{{ current_user.get('bio','') if current_user else '' }}</textarea></div>
          <button type="submit" class="btn btn--primary">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
  {% endblock %}
