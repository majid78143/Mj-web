{% extends 'admin/base.html' %}
  {% block title %}AI Settings{% endblock %}{% block pagetitle %}CodeForge AI Settings{% endblock %}
  {% block content %}
  <div class="adm-form-wrap">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="adm-box">
      <h3 class="adm-box__section-title">Identity</h3>
      <div class="field"><label>AI Name</label><input type="text" name="name" value="{{ cfg.get('name','CodeForge AI') }}"></div>
      <div class="field"><label>Welcome Message</label><textarea name="welcome_message" rows="2">{{ cfg.get('welcome_message','') }}</textarea></div>
    </div>
    <div class="adm-box">
      <h3 class="adm-box__section-title">Behaviour</h3>
      <div class="field"><label>System Prompt</label><textarea name="system_prompt" rows="8" style="font-family:monospace;font-size:13px">{{ cfg.get('system_prompt','') }}</textarea></div>
      <div class="field"><label>Model</label>
      <select name="model"><option value="gpt-3.5-turbo" {{ 'selected' if cfg.get('model','gpt-3.5-turbo')=='gpt-3.5-turbo' }}>GPT-3.5 Turbo</option><option value="gpt-4" {{ 'selected' if cfg.get('model')=='gpt-4' }}>GPT-4</option><option value="gpt-4o" {{ 'selected' if cfg.get('model')=='gpt-4o' }}>GPT-4o</option></select></div>
      <label class="toggle-label"><input type="checkbox" name="enabled" {{ 'checked' if cfg.get('enabled',True) }}> Enable AI Assistant (visible on site)</label>
    </div>
    <div class="adm-form-footer"><button type="submit" class="btn btn--primary">Save AI Settings</button></div>
  </form>
  </div>
  {% endblock %}
