{% extends 'admin/base.html' %}
  {% block title %}Categories{% endblock %}{% block pagetitle %}Categories{% endblock %}
  {% block content %}
  <div class="adm-box" style="max-width:480px;margin-bottom:24px">
    <form method="POST" action="{{ url_for('admin_categories') }}" style="display:flex;gap:10px">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="text" name="name" required placeholder="Category name" style="flex:1">
      <button type="submit" class="btn btn--primary">Add</button>
    </form>
  </div>
  <div class="adm-box" style="max-width:480px"><table class="tbl">
  <thead><tr><th>Name</th><th></th></tr></thead>
  <tbody>{% for c in categories %}<tr>
  <td><strong>{{ c['name'] }}</strong></td>
  <td><form method="POST" action="{{ url_for('admin_category_delete', cid=c['id']) }}" onsubmit="return confirm('Delete?')">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <button class="btn btn--xs btn--danger">Delete</button></form></td>
  </tr>{% endfor %}</tbody></table></div>
  {% endblock %}
