{% extends 'admin/base.html' %}
  {% block title %}Edit Legal Page{% endblock %}{% block pagetitle %}Edit: {{ slug.replace('-',' ').title() }}{% endblock %}
  {% block content %}
  <div class="adm-form-wrap">
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="adm-box">
      <p class="text-muted text-sm" style="margin-bottom:12px">HTML is supported. Use heading tags, paragraphs, lists, etc.</p>
      <div class="field"><label>Content</label><textarea name="content" rows="22" style="font-family:monospace;font-size:13px">{{ content }}</textarea></div>
    </div>
    <div class="adm-form-footer">
      <button type="submit" class="btn btn--primary">Save Page</button>
      <a href="{{ url_for('admin_legal') }}" class="btn btn--ghost">Cancel</a>
    </div>
  </form>
  </div>
  {% endblock %}
